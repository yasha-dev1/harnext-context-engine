[project]
name = "harnext-builder"
version = "0.1.0"
description = "Stateless builder consumer: runs a coding harness over each org's AgentFS to incorporate events."
requires-python = ">=3.12"
dependencies = [
    "harnext-shared",
    "aiokafka>=0.11",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "harnext>=1.5.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
retrieval = ["fastembed==0.7.4"]

[project.scripts]
harnext-builder = "harnext_builder.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnext_builder"]
