# Live smoke on the final engine code (28 Sep, image 2bc32a8f7039): SMOKE benchmark only. Historical part:
# the first 6 historical tasks of the run order (they include issue_changed_files, which needs GitHub +
# JIRA) under S-tools, H-engine, H-engine-mem = 18 trials, two at a time. The one coding trial
# (H-engine only) runs afterwards, alone, from e2-engine-smoke-live-3-coding.yaml (same run id).
protocol: harnext-e2-v2
run_id: engine-smoke-live-3
benchmark: ../benchmarks/kafka-500-v2-smoke
arms_file: ../benchmarks/kafka-500-v2/arms.yaml
arms: [S-tools, H-engine, H-engine-mem]
agent: claude-code
model: claude-haiku-4-5-20251001
effort: medium
stores: ../out/kafka-500-v2/stores-smoke
checkouts: ../out/kafka-500-v2/runs/engine-smoke-live-3/checkouts
results: ../out/kafka-500-v2/runs/engine-smoke-live-3/results
workspaces: ../out/kafka-500-v2/runs/engine-smoke-live-3/workspaces
workers: 2
coding_workers: 2  # no coding task in this half: one pool of two historical workers
timeouts: {historical: 900, coding: 3600, grading: 3000}
