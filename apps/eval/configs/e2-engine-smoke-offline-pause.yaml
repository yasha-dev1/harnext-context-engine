# Pause half of e2-engine-smoke-offline.yaml (same run_id): the engine provider "fails" on the third
# agent call (FakeAgent reader_infra_at): the runner must pause, record nothing for that trial,
# and the plain config must then resume and finish.
protocol: harnext-e2-v2
run_id: engine-smoke-offline
benchmark: ../benchmarks/kafka-500-v2-smoke
arms_file: ../benchmarks/kafka-500-v2/arms.yaml
arms: [N, S-tools, H-engine, H-engine-mem]
agent: fake
model: fake
reader: fake
stores: ../out/kafka-500-v2/stores-smoke
checkouts: ../out/kafka-500-v2/runs/engine-smoke-offline/checkouts
results: ../out/kafka-500-v2/runs/engine-smoke-offline/results
workspaces: ../out/kafka-500-v2/runs/engine-smoke-offline/workspaces
workers: 1  # deterministic call order: the 3rd agent call is H-engine on the first task
commit_every: 0
min_free_gib: 5
store_hash: tree
max_coding: 1
max_historical: 4
fake:
  reader_infra_at: 3
