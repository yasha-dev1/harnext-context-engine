# E1 routing only: no probes, stores, or action provider.
# Window bounds are half-open; pass --window START END to run/prereg.
offline: true
e1:
  # Amendment 2026-09-05: the GitHub GraphQL extractor carries no CI/check/status events
  # (GH Archive was dropped for size), so the trunk-CI labeling function has zero coverage
  # and cannot be computed. It is dropped before fitting and recorded in PREREG.
  exclude_label_functions: [github_trunk_ci_failure_fix_6h]
prices: {model: fake, effective_date: offline-fake-v1, input_per_million: 1.0, output_per_million: 4.0}
erosion_panel_size: 10
engine:
  router:
    rules: {enabled: true}
    deviation: {enabled: true}
    budget_pct: 2.0
    guards: {absolute_floor: 3, multi_window: true, situation_dedup: false}
  window: {gap_s: 30, max_events: 20, max_age_s: 120}
  store:
    layout: S0
    backend: git
  builder:
    harness: fake
    model: null
    prompt_version: v1
  reader:
    provider: fake
    budget_tokens: 8000
  envelope: V3
  embeddings: {provider: fake, dim: 64}
  lane_design: two-lane
budgets: {read_tokens: [2000, 8000, 32000]}
seeds: [1]
