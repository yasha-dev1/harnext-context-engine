[project]
name = "harnext-eval"
version = "0.1.0"
description = "Offline-first evaluation framework for the harnext context engine."
requires-python = ">=3.12"
dependencies = [
    "harnext-shared",
    "harnext-builder",
    "harnext-classifier",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyod>=2.0",
    "rank-bm25>=0.2",
    "matplotlib>=3.9",
    "hdrhistogram>=0.10",
    "jinja2>=3.1",
    "datasketch>=1.6",
    "aiokafka>=0.11",
]

[project.optional-dependencies]
# Arm G-graphiti (E2 v2): the official Zep/Graphiti package, pinned, embedded Kuzu backend,
# plus the MCP library used by e2/v2/mcp_server.py (same one apps/mcp depends on).
graphiti = [
    "graphiti-core[anthropic,kuzu]==0.30.2",
    "kuzu==0.11.3",
    "fastmcp>=2.0",
]
# Arm RAW (E2 engine, e2/v2/stores/raw): embedded ClickHouse for the per-source raw tables.
# A production ClickHouse server is reached with clickhouse-connect instead (not needed here).
raw = [
    "chdb==4.4.0",
]

[project.scripts]
harnext-eval = "harnext_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnext_eval"]
